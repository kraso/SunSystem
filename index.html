<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SunSystem — Simulación 3D del Sistema Solar</title>
  <link rel="icon" href="textures/sun.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" />
  <link rel="stylesheet" href="/src/ui/styles.css" />
</head>
<body>
  <div id="app"></div>

  <!-- HUD: barra superior (título centrado + controles de ventana) -->
  <div id="top-bar">
    <span class="app-title">SunSystem</span>
  </div>

  <!-- Sidebar de navegación: colapsable (solo iconos; se expande al hover) -->
  <aside id="sidebar">
    <nav class="sidebar-nav">
      <div class="side-btn side-select-wrap">
        <span class="side-ico"><i data-lucide="crosshair"></i></span>
        <select id="focus-planet" class="side-select-native" title="Saltar a un planeta">
          <option value="">→ Enfocar</option>
        </select>
      </div>
      <a id="btn-luna" class="side-btn" href="./luna.html" title="Fases de la Luna"><span class="side-ico"><i data-lucide="moon"></i></span><span class="side-text">Luna</span></a>
      <a id="btn-stats" class="side-btn" href="./estadisticas.html" title="Estadísticas"><span class="side-ico"><i data-lucide="bar-chart-3"></i></span><span class="side-text">Estadísticas</span></a>
      <a id="btn-planetario" class="side-btn" href="./planetario.html" title="Planetario (cúpula celeste)"><span class="side-ico"><i data-lucide="orbit"></i></span><span class="side-text">Planetario</span></a>
      <a id="btn-constelaciones" class="side-btn" href="./constelaciones.html" title="Cartas de constelaciones"><span class="side-ico"><i data-lucide="stars"></i></span><span class="side-text">Constelaciones</span></a>
      <a id="btn-misiones" class="side-btn" href="./misiones.html" title="Histórico de misiones espaciales"><span class="side-ico"><i data-lucide="rocket"></i></span><span class="side-text">Misiones</span></a>
      <a id="btn-catastrofes" class="side-btn" href="./catastrofes.html" title="Catástrofes estelares"><span class="side-ico"><i data-lucide="bomb"></i></span><span class="side-text">Catástrofes</span></a>
      <a id="btn-cuerpos-menores" class="side-btn" href="./cuerpos-menores.html" title="Cuerpos menores"><span class="side-ico"><i data-lucide="asterisk"></i></span><span class="side-text">Cuerpos menores</span></a>
      <a id="btn-acercade" class="side-btn" href="./acercade.html" title="Acerca De"><span class="side-ico"><i data-lucide="info"></i></span><span class="side-text">Acerca De</span></a>
    </nav>
  </aside>

  <!-- Panel de información (oculto por defecto; se abre al hacer clic en un astro) -->
  <div id="info-panel" class="hidden">
    <button id="info-close" class="info-close" type="button" title="Cerrar (✕)">✕</button>
    <div id="info-panel-content">
      <h2 id="info-name">Selecciona un cuerpo celeste</h2>
      <div id="info-stats"></div>
      <p id="info-desc"></p>
    </div>
  </div>

  <!-- Barra inferior: controles de tiempo -->
  <div id="bottom-bar">
    <button id="btn-pause" class="btn-hud-sm" title="Pausa (Espacio)"><span class="ico">⏯</span></button>
    <button id="btn-slower" class="btn-hud-sm" title="Más lento (-)"><span class="ico">◀◀</span></button>
    <input type="range" id="speed-slider" min="0" max="100" value="10" title="Velocidad de simulación" />
    <button id="btn-faster" class="btn-hud-sm" title="Más rápido (+)"><span class="ico">▶▶</span></button>
    <span id="speed-label">1 mes/s</span>
    <select id="label-mode" class="btn-hud" title="Mostrar etiquetas">
      <option value="all">Etiquetas: Todas</option>
      <option value="planets">Solo planetas</option>
      <option value="moons">Solo satélites</option>
      <option value="none">Ninguna</option>
    </select>
    <button id="btn-orbits" class="btn-hud" title="Mostrar/ocultar líneas orbitales"><span class="ico">🪐</span> Órbitas</button>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
